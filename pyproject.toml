[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysti"
version = "0.1.0"
description = "MYSTI - private, encrypted personal AI operating layer (Phase 0: Foundation)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "boto3>=1.34",
    "keyring>=24",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5",
    "black>=24",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
mysti = "mysti.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mysti"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
